<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Pipeline — Interactive Flow</title>
<style>
  :root{
    --paper:#f4f3ef; --card:#fbfbf9; --ink:#1c1c1a; --mute:#6b6b66; --faint:#9a9a93;
    --line:#dcdbd6; --hair:#e6e5e0; --accent:#2a2a27;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55;
    padding:40px 28px 72px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:26px;margin:0 0 4px;letter-spacing:.2px}
  .sub{color:var(--mute);font-size:13.5px;margin:0 0 24px}
  hr.hr{height:1px;background:var(--line);border:0;margin:0 0 26px}

  .app{display:flex;gap:42px;align-items:flex-start}
  @media(max-width:860px){.app{flex-direction:column}}

  /* ---- flow rail ---- */
  .rail{width:296px;flex:none}
  @media(max-width:860px){.rail{width:100%}}
  .sech{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);margin:0 0 12px}

  .node{
    position:relative;width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
    padding:12px 14px;border-radius:2px;transition:border-color .12s,background .12s;
    display:flex;align-items:baseline;gap:11px;font:inherit;color:inherit;
  }
  .node:hover{border-color:var(--faint)}
  .node.active{border-color:var(--accent);border-left-color:var(--accent);background:#fff}
  .node .num{font-family:Georgia,serif;font-size:13px;color:var(--faint);min-width:14px}
  .node.active .num{color:var(--accent)}
  .node .nm{font-weight:600;font-size:13.5px}
  .node .rl{display:block;font-weight:400;font-size:11.5px;color:var(--mute);margin-top:2px}
  .conn{height:18px;width:3px;background:var(--hair);margin:0 0 0 calc(14px + 1px)}
  .conn::after{content:"";display:block}

  .fgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}
  .fnode{cursor:pointer;background:var(--card);border:1px dashed var(--line);border-radius:2px;
    padding:10px 13px;font:inherit;color:inherit;text-align:left}
  .fnode:hover{border-color:var(--faint)}
  .fnode.active{border-style:solid;border-color:var(--accent);background:#fff}
  .fnode .nm{font-weight:600;font-size:12.5px}
  .fnode .rl{display:block;font-size:11px;color:var(--mute);margin-top:2px}
  .loopnote{font-size:11px;color:var(--faint);margin:14px 0 0;padding-left:2px}

  /* ---- detail panel ---- */
  .panel{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:3px;
    padding:28px 32px}
  @media(max-width:860px){.panel{width:100%}}
  .ptag{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}
  .ptitle{font-family:Georgia,serif;font-size:22px;margin:6px 0 2px}
  .pq{color:var(--mute);font-style:italic;font-size:13.5px;margin:0 0 22px}
  .sec{margin:0 0 18px}
  .sec h3{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);
    margin:0 0 8px;font-weight:600}
  .sec p{margin:0;font-size:13.5px}
  .sec ul{margin:0;padding-left:18px}
  .sec li{font-size:13px;margin:0 0 5px}
  .io{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 22px}
  .io .box{flex:1;min-width:200px;border:1px solid var(--hair);border-radius:2px;padding:11px 14px}
  .io .box .lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint)}
  .io .box .val{font-size:13px;margin-top:3px}
  .math{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:12.5px;
    background:#f0efea;border:1px solid var(--hair);border-radius:2px;padding:10px 13px;margin:0 0 7px;
    white-space:pre-wrap;color:#33332f}
  .kill{border-left:3px solid var(--accent);background:#f0efea;padding:10px 14px;border-radius:2px;
    font-size:13px}
  .kill b{font-weight:600}
  .ptable{width:100%;border-collapse:collapse;margin:2px 0 6px;font-size:12.5px}
  .ptable th{text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);
    font-weight:600;border-bottom:1px solid var(--line);padding:5px 12px 5px 0}
  .ptable td{border-bottom:1px solid var(--hair);padding:6px 12px 6px 0;vertical-align:top}
  .ptable td:first-child{font-weight:600}
  .callout{border-left:3px solid var(--faint);background:#f0efea;border-radius:2px;padding:11px 14px;
    font-size:13px;margin:0 0 6px}
  .callout b{font-weight:600}
  .note{font-size:12px;color:var(--mute);margin:8px 0 0}
  .note b{color:var(--ink);font-weight:600}
  .seed{margin:0;padding-left:18px}
  .seed li{font-size:13px;margin:0 0 6px}
  .seed b{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>The QR Pipeline</h1>
  <p class="sub">Click any step — or a built-once engine — to see what's inside it. Each step is a kill-gate: it dies cheaply before the next, more expensive one.</p>
  <hr class="hr">

  <div class="app">
    <div class="rail">
      <p class="sech">Per-idea flow</p>
      <div id="flow"></div>

      <p class="sech" style="margin-top:26px">Built once · horizontal engines</p>
      <div id="found" class="fgrid"></div>

      <p class="loopnote">↳ Step 3 ⇄ 4: refine &amp; retry, max 3×<br>↻ Step 8 → Step 1: learnings recycle</p>
    </div>

    <div id="panel" class="panel"></div>
  </div>
</div>

          '<rect x="24" y="312" width="612" height="30" rx="2" fill="#f0efea" stroke="#cfcec8"/>'+
          '<text x="330" y="331" font-size="10" fill="#1c1c1a" text-anchor="middle">L0 raw  &#8594;  L1 clean  &#8594;  L2 adjusted  &#8594;  L3 research-view   (one-way &#183; raw is sacred)</text>'+
          '<rect x="140" y="378" width="380" height="32" rx="2" fill="#2a2a27"/>'+
          '<text x="330" y="398" font-size="9.5" fill="#fbfbf9" text-anchor="middle">STEP 2 &#8212; instantiate ONE canonical series (asset &#183; venue &#183; freq &#183; window)</text>'+
          '<text x="330" y="442" font-size="10.5" fill="#1c1c1a" text-anchor="middle">&#8594; Step 3</text>'+
          '<g stroke="#b0afa9" stroke-width="1.3" marker-end="url(#de)" fill="none">'+
          '<path d="M83 36 L83 56"/>'+
          '<path d="M245 36 L245 56"/>'+
          '<path d="M407 36 L407 56"/>'+
          '<path d="M573 36 L573 56"/>'+
          '<path d="M330 360 L330 374"/>'+
          '<path d="M330 412 L330 426"/>'+
          '</g>'+
          '</svg>'+
          '<p class="note"><b>The spine is the whole point:</b> two clocks (event-time + knowledge-time), stable symbology, a lineage hash &#8212; it guarantees the tape you backtest equals the tape you trade.</p>'},
       {h:"What each venue can supply",
        html:'<p class="note">What you can <em>research</em> is capped by what each venue\'s data can <em>supply</em>. Volume and flow are <b>asset-class-gated</b> &#8212; a CFD has no central book, so no real volume and no order flow exist on it at all.</p>'+
          '<table class="ptable"><tr><th>Venue</th><th>Asset</th><th>Real volume</th><th>Order flow</th><th>Options</th></tr>'+
          '<tr><td>Just Markets <span style="font-weight:400">(real $)</span></td><td>XAUUSD CFD</td><td>&#10007; tick-vol proxy</td><td>&#10007; no book</td><td>&#10007;</td></tr>'+
          '<tr><td>Darwinex Zero</td><td>CME/Eurex futures + ETFs</td><td>&#10003; exchange</td><td>partial (depth)</td><td>limited</td></tr>'+
          '<tr><td>IBKR <span style="font-weight:400">(paper)</span></td><td>equities + futures</td><td>&#10003;</td><td>&#10003; L2</td><td>&#10003; rich</td></tr></table>'+
          '<p class="note"><b>The uncomfortable reading:</b> data richness is <em>inverse</em> to where your money is. Just Markets &#8212; real capital &#8212; is the data-poorest; IBKR &#8212; paper &#8212; is the richest. So every volume / flow / options / cross-sectional edge can only be researched on the venues where you are <b>not yet</b> trading real money. Plus external feeds you need regardless: FRED (macro vintages, free) &#183; an options / IV vendor &#183; continuous-futures + term-structure.</p>'},
       {h:"Adjustment is asset-class-specific",
        html:'<table class="ptable"><tr><th>Class</th><th>What to adjust</th><th>The trap</th></tr>'+
          '<tr><td>Futures</td><td>contract rolls &#8594; back / ratio-adjusted continuous</td><td>roll gaps fake a jump &amp; a return</td></tr>'+
          '<tr><td>Equities</td><td>splits + dividends &#8594; total-return adjust</td><td>survivorship; unadjusted divs</td></tr>'+
          '<tr><td>CFD spot (gold)</td><td>nothing on price &#8212; financing is a <em>cost</em>, not a price</td><td>broker-specific quotes; weekend gaps</td></tr>'+
          '<tr><td>FX</td><td>none &#8212; rollover is carry</td><td>quote source differs by venue</td></tr>'+
          '<tr><td>Options</td><td>build the IV surface, not the price</td><td>stale strikes; moneyness misalign</td></tr>'+
          '<tr><td>Crypto</td><td>none &#8212; but pick the venue tape</td><td>fragmented venues disagree</td></tr></table>'+
          '<p class="note"><b>Wrong adjustment manufactures fake alpha or hides real risk.</b> IB-001 is CFD gold &#8594; no price adjustment, but the swap becomes a cost downstream. IB-003 / IB-004 on Darwinex futures &#8594; continuous-contract roll adjustment is mandatory.</p>'},
       {h:"Point-in-time — the one thing that kills backtests",
        html:'<div class="callout"><b>Two clocks:</b> event-time (when it happened) vs knowledge-time (when you would have known). Stamp every record with knowledge-time. Prices &#8594; never read a bar before it closes. Macro / fundamentals get revised &#8594; use the vintage you would have had, never today\'s value.</div>'+
          '<p class="note"><b>Cleaning rule:</b> fix errors, never events &#8212; patch gaps, drop true bad ticks, but never smooth away real moves. Log every touch.</p>'},
       ],
     kill:"Data unavailable, too short, survivorship-biased, or can't be made point-in-time."},

    {num:"3",name:"IS Rapid Fire",role:"Vectorized coarse screen, in-sample",
     q:"Does the signal predict forward returns at all?",
     in:"Clean IS data (one series OR a panel) + vol (Market State Engine · E4)",
     out:"A ranked shortlist with measured in-sample IC + a decay profile",
     inside:[
       "Run the contract: COMPUTE(PIT_data) → standardized forecast — same code, any asset",
       "Switch IC mode by the Step 1 <em>universe</em>: one series → time-series IC; a panel → cross-sectional IC",
       "Measure <em>predictive power</em>, not PnL (PnL is the most over-fittable number)",
       "Vectorized — fast and cheap; sweep many ideas and horizons",
       "Log <em>every</em> variant to the Ledger — the trial count is what makes Step 4 deflation honest",
       "Ignores costs and fills — that is Step 6's job, not this stage's"],
     math:[
       "IC (Information Coefficient) = rank_corr( signal_t , return_{t+h} )",
       "ICIR (IC Information Ratio) = mean(IC) / std(IC)        t (t-statistic) = ICIR × √N_eff",
       "IR (Information Ratio, Grinold) = IC × √BR (Breadth)        decile spread = top − bottom fwd return",
       "decay = IC vs horizon h (half-life)        N_eff = effective sample size (autocorrelation-adjusted)"],
     extra:[
       {h:"The Rapid Fire flow",
        html:'<svg viewBox="0 0 660 426" style="width:100%;height:auto;margin-top:2px">'+
          '<defs><marker id="rf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#8a8a84" stroke-width="1.4"/></marker></defs>'+

          '<rect x="340" y="128" width="280" height="60" rx="2"/>'+
          '<rect x="160" y="210" width="340" height="46" rx="2"/>'+
          '<rect x="150" y="324" width="360" height="44" rx="2"/>'+
          '</g>'+
          '<rect x="180" y="270" width="300" height="40" rx="2" fill="#fbfbf9" stroke="#2a2a27" stroke-width="1.4"/>'+
          '<rect x="516" y="276" width="134" height="28" rx="2" fill="#f0efea" stroke="#cfcec8"/>'+
          '<rect x="150" y="378" width="360" height="38" rx="2" fill="#2a2a27"/>'+
          '<g font-size="10.5" fill="#1c1c1a" text-anchor="middle">'+
          '<text x="330" y="31">IS data (Step 2) + vol (Market State Engine · E4)</text>'+
          '<text x="330" y="82">COMPUTE(PIT_data) &#8594; standardized forecast</text>'+

          '</g>'+

          '<text x="180" y="148" font-weight="600">Time-series IC</text>'+
          '<text x="480" y="148" font-weight="600">Cross-sectional IC</text>'+
          '</g>'+

          '<text x="330" y="359">decile-spread monotonic? &#183; decay shape &#183; sign matches thesis</text>'+
          '</g>'+
          '<text x="330" y="120" font-size="9" fill="#9a9a93" text-anchor="middle">&#9660; switch on Step 1 universe</text>'+
          '<text x="498" y="285" font-size="9" fill="#9a9a93">no</text>'+
          '<text x="338" y="320" font-size="9" fill="#9a9a93">yes</text>'+
          '<text x="583" y="294" font-size="9.5" fill="#1c1c1a" text-anchor="middle">IC &#8776; 0 / t &lt; 2 &#8594; die</text>'+
          '<g font-size="10" fill="#fbfbf9" text-anchor="middle">'+
          '<text x="330" y="396">&#8594; Step 4 (is the edge REAL?)</text>'+
          '<text x="330" y="409" font-size="8.5">log EVERY variant to the Ledger &#8594; feeds Step 4 deflation</text>'+
          '</g>'+
          '</svg>'+
          '<p class="note">The IC mode is not chosen here &#8212; it is <b>forced by the data shape</b> the Step 1 universe set. One contract, one measurement engine, two ways to score the same forecast.</p>'},
       {h:"The metrics — what each is, why, and the mental model",
        html:'<table class="ptable"><tr><th>Symbol</th><th>Full name</th><th>What it measures / why</th><th>Mental model</th></tr>'+
          '<tr><td>IC</td><td>Information Coefficient</td><td>rank correlation of forecast vs forward return &#8212; isolates predictive <em>skill</em> from sizing, costs and PnL</td><td>a report-card grade: did higher conviction line up with higher return?</td></tr>'+
          '<tr><td>ICIR</td><td>IC Information Ratio</td><td>mean(IC) / std(IC) &#8212; how <em>stable</em> the skill is over time, not just its average</td><td>a steady B beats a wild A-then-F</td></tr>'+
          '<tr><td>t</td><td>t-statistic</td><td>ICIR &#215; &#8730;N_eff &#8212; is the average IC distinguishable from luck? the kill gate is t &gt; 2</td><td>how many standard errors away from zero coincidence</td></tr>'+
          '<tr><td>IR</td><td>Information Ratio</td><td>IC &#215; &#8730;Breadth (Grinold) &#8212; the risk-adjusted edge you can actually harvest</td><td>skill per bet &#215; number of independent bets</td></tr>'+
          '<tr><td>N_eff</td><td>effective sample size</td><td>independent observations left after autocorrelation correction</td><td>your real count of coin-flips &#8212; overlapping bars are not independent flips</td></tr>'+
          '<tr><td>PIT</td><td>Point-In-Time</td><td>data as it was known at time t, with no future leak</td><td>blinders to the future &#8212; you see only what was on the screen then</td></tr>'+
          '<tr><td>IS / OOS</td><td>In-Sample / Out-of-Sample</td><td>data used to build the signal vs data sealed away to test it</td><td>practice exam vs the real, unseen exam</td></tr></table>'+
          '<p class="note"><b>Why two skill metrics, not one:</b> IC is per-bet skill; ICIR is how reliably you harvest it. The Qian-Hua (2004) extension shows realized IR is haircut by the volatility of IC &#8212; exactly what ICIR captures. Complementary, not redundant.</p>'},
       {h:"Two IC modes — the universe is the switch",
        html:'<table class="ptable"><tr><th>&nbsp;</th><th>Time-series IC</th><th>Cross-sectional IC</th></tr>'+
          '<tr><td>Universe</td><td>one instrument</td><td>a panel of many names</td></tr>'+
          '<tr><td>Correlate</td><td>signal vs fwd return down time</td><td>signal vs fwd return across names each t, then average</td></tr>'+
          '<tr><td>Skill measured</td><td>timing</td><td>selection (market-neutral)</td></tr>'+
          '<tr><td>Breadth from</td><td>independent time periods</td><td>names &#215; rebalances (&#8810; raw, names are correlated)</td></tr>'+
          '<tr><td>Your case</td><td>XAUUSD, single future (IB-001)</td><td>equities, futures basket (the Balyasny / Millennium pitch)</td></tr></table>'+
          '<p class="note"><b>The "500 names" rule is a half-truth</b> &#8212; it applies only to the cross-sectional column. A single CFD/future is measured time-series; breadth is its independent time bets, not asset count.</p>'},
       {h:"One gate, not a metric buffet",
        html:'<div class="callout"><b>One necessary kill per stage: the IC t-stat.</b> Decile-spread monotonicity and the decay curve are <em>diagnostics</em> &#8212; they help you understand and reject, never act as alternative ways to pass. Three pass-routes = metric-shopping = manufactured false positives.</div>'+
          '<p class="note">The other questions are not ignored, they live downstream: tails / factor-orthogonality &#8594; Step 4 · OOS stability &#8594; Step 5 · costs &#8594; Step 6. Step 3 owns exactly one question &#8212; <b>does the edge exist</b> &#8212; kept cheap and brutal.</p>'+
          '<p class="note"><b>The real bottleneck is discipline, not compute.</b> Because it is cheap you will run dozens of variants; log every one. Watch overlapping returns &#8212; they inflate the t-stat unless you use effective N (block / Newey-West).</p>'}],
     kill:"IC ≈ 0 or t-stat < 2 (on effective N). The brutal cut — most ideas die here."},

    {num:"4",name:"IS Validation",role:"Honest accounting before breaking the OOS seal",
     q:"Does this IS result hold up to scrutiny — or is it a statistical artefact?",
     in:"Signals that passed the Step 3 IC t-stat gate",
     out:"A corrected, factor-orthogonal IS claim — or a kill",
     inside:[
       "Gate 1 — DSR: discount the observed Sharpe by total trial count N from the Ledger; kill if PSR &lt; 0.95",
       "Gate 2 — Factor Decomposition: regress signal returns against known risk premia; kill if t(&#945;) &lt; 2",
       "Gate 3 — Regime Diagnostic: compute IC per regime using past-data-only labels; flag if IC collapses",
       "The Rule: any gate fails &#8594; back to Step 1, revise hypothesis. Never tune parameters here."],
     math:[
       "PSR(SR*) = Φ( (SR̂ − SR*) · √(T−1) / √(1 − skew·SR̂ + (kurt−1)/4 · SR̂²) )",
       "SR* = √Var(SR) · [ (1−γ)·Φ⁻¹(1 − 1/N) + γ·Φ⁻¹(1 − 1/(N·e)) ]   [expected best SR of N trials; γ = Euler–Mascheroni; per-period units]",
       "R_signal = α + Σ βₖ·Fₖ + ε   →   t(α) > 2 required to keep",
       "IC_j = rank_corr( signal_t , return_{t+h} ) | regime_t = j   →   stable across all j"],
     extra:[
       {h:"IS Validation flow",
        html:'<svg viewBox="0 0 660 400" style="width:100%;height:auto;margin-top:2px">'+
          '<defs><marker id="iv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#8a8a84" stroke-width="1.4"/></marker></defs>'+
          '<g stroke="#b0afa9" stroke-width="1.3" marker-end="url(#iv)" fill="none">'+
          '<path d="M310 46 L310 60"/><path d="M310 122 L310 138"/><path d="M310 200 L310 216"/>'+
          '<path d="M310 278 L310 296"/><path d="M310 344 L310 360"/>'+
          '<path d="M480 91 L516 91"/><path d="M480 169 L516 169"/><path d="M480 247 L516 247"/>'+
          '</g>'+
          '<g fill="#fbfbf9" stroke="#cfcec8" stroke-width="1">'+
          '<rect x="165" y="12" width="290" height="34" rx="2"/>'+
          '<rect x="115" y="60" width="365" height="62" rx="2"/>'+
          '<rect x="115" y="138" width="365" height="62" rx="2"/>'+
          '<rect x="115" y="216" width="365" height="62" rx="2"/>'+
          '<rect x="115" y="296" width="365" height="48" rx="2"/>'+
          '</g>'+
          '<g fill="#2a2a27">'+
          '<rect x="115" y="60" width="4" height="62"/><rect x="115" y="138" width="4" height="62"/><rect x="115" y="216" width="4" height="62"/>'+
          '</g>'+
          '<g fill="#f0efea" stroke="#cfcec8" stroke-width="1">'+
          '<rect x="516" y="77" width="130" height="28" rx="2"/>'+
          '<rect x="516" y="155" width="130" height="28" rx="2"/>'+
          '<rect x="516" y="233" width="130" height="28" rx="2"/>'+
          '</g>'+
          '<rect x="165" y="360" width="290" height="36" rx="2" fill="#2a2a27"/>'+
          '<g font-size="10.5" fill="#1c1c1a" text-anchor="middle">'+
          '<text x="310" y="33">Signals from Step 3 &#8212; IC t-stat &gt; 2 passed</text>'+
          '<text x="297" y="76" font-weight="600">GATE 1 &#8212; Deflated Sharpe Ratio (DSR)</text>'+
          '<text x="297" y="90" font-size="9.5" fill="#6b6b66">Discount observed SR&#770; by total trial count N from the Ledger</text>'+
          '<text x="297" y="104" font-size="9" fill="#6b6b66">PSR = P(your result is not the lucky pick from N tries)</text>'+
          '<text x="297" y="154" font-weight="600">GATE 2 &#8212; Factor Decomposition</text>'+
          '<text x="297" y="168" font-size="9.5" fill="#6b6b66">Regress returns against known risk premia &#8594; isolate residual &#945;</text>'+
          '<text x="297" y="182" font-size="9" fill="#6b6b66">&#945; explained by a known factor is not novel &#8212; a PM can buy it cheaper</text>'+
          '<text x="297" y="232" font-weight="600">GATE 3 &#8212; Regime Diagnostic</text>'+
          '<text x="297" y="246" font-size="9.5" fill="#6b6b66">IC per regime using past-data-only labels (HMM / Hurst / vol percentile)</text>'+
          '<text x="297" y="260" font-size="9" fill="#6b6b66">IC must hold across regimes &#8212; not just in a favourable sample</text>'+
          '<text x="297" y="312" font-weight="600">THE RULE</text>'+
          '<text x="297" y="326" font-size="9.5" fill="#6b6b66">Any gate fails &#8594; back to Step 1. Never tune parameters here.</text>'+
          '<text x="297" y="338" font-size="9" fill="#6b6b66">Tuning here adds hidden trials &#8212; corrupts the Ledger count N.</text>'+
          '</g>'+
          '<g font-size="9.5" fill="#1c1c1a" text-anchor="middle">'+
          '<text x="581" y="95">PSR &lt; 0.95 &#8594; KILL</text>'+
          '<text x="581" y="173">t(&#945;) &lt; 2 &#8594; KILL</text>'+
          '<text x="581" y="251">collapses &#8594; Step 1</text>'+
          '</g>'+
          '<g font-size="9" fill="#9a9a93">'+
          '<text x="487" y="87">no</text><text x="487" y="165">no</text><text x="487" y="243">no</text>'+
          '<text x="318" y="133">yes</text><text x="318" y="211">yes</text><text x="318" y="291">yes</text>'+
          '</g>'+
          '<text x="310" y="381" font-size="10.5" fill="#fbfbf9" text-anchor="middle">Honest IS claim &#8594; Step 5 OOS seal</text>'+
          '</svg>'+
          '<p class="note">Three sequential kill gates on the same IS data. Each catches a different lie. All three must pass before touching the OOS seal in Step 5.</p>'},
       {h:"Metrics — what, why, mental model",
        html:'<table class="ptable"><tr><th>Symbol</th><th>Full name</th><th>What it measures / why</th><th>Mental model</th></tr>'+
          '<tr><td>SR&#770;</td><td>Observed Sharpe Ratio</td><td>Annualised mean return / std &#8212; raw IS performance before trial correction</td><td>The exam score before checking if you guessed lucky</td></tr>'+
          '<tr><td>SR*</td><td>Benchmark Sharpe</td><td>Expected best SR from N zero-alpha trials &#8212; the luck ceiling. Rises with N.</td><td>The best score a random guesser gets after N tries</td></tr>'+
          '<tr><td>PSR</td><td>Probability of Sharpe Ratio</td><td>P(true SR &gt; 0) given N trials &#8212; DSR output. Kill gate: PSR &gt; 0.95.</td><td>How confident we are the result is not luck</td></tr>'+
          '<tr><td>N</td><td>Trial count (Ledger)</td><td>Total variants logged in Step 3 &#8212; raises SR* and makes passing harder</td><td>How many lottery tickets you bought</td></tr>'+
          '<tr><td>T</td><td>Observation count</td><td>IS sample size &#8212; statistical power. More T makes a real signal easier to detect.</td><td>How large your evidence base is</td></tr>'+
          '<tr><td>skew</td><td>Return skewness</td><td>Asymmetry of the return distribution &#8212; left skew reduces PSR</td><td>Are bad outcomes bigger than good ones</td></tr>'+
          '<tr><td>kurt</td><td>Excess kurtosis</td><td>Fat-tail measure &#8212; leptokurtosis reduces PSR (extreme draws inflate the luck baseline)</td><td>How often extreme returns hit</td></tr>'+
          '<tr><td>&#945; (alpha)</td><td>Residual alpha</td><td>Return unexplained by any known factor &#8212; the novel edge after stripping all free premia</td><td>What is left after removing the free lunch</td></tr>'+
          '<tr><td>&#946;&#8342;</td><td>Factor loading k</td><td>Sensitivity to factor F&#8342; &#8212; the "free ride" coefficient on a known premium</td><td>How much of your return just buys a known factor</td></tr>'+
          '<tr><td>F&#8342;</td><td>Risk factor k</td><td>Known premia: market, momentum, carry, value, VRP &#8212; anything a PM would ask about</td><td>The free lunches your signal must outperform</td></tr>'+
          '<tr><td>IC&#11388;</td><td>Regime-conditional IC</td><td>IC within regime j, labelled using only past data &#8212; tests whether skill is general</td><td>Does your skill hold when market conditions change</td></tr>'+
          '</table>'+
          '<p class="note"><b>PSR vs plain t-stat on SR:</b> A t-stat ignores how many signals you discarded to find this one. PSR accounts for N &#8212; the more you searched, the higher the luck ceiling you must beat.</p>'},
       {h:"Gate 1 &#8212; DSR: why this model",
        html:'<div class="callout"><b>The multiple-testing problem in one sentence:</b> test 100 uncorrelated signals at 5 % significance and ~5 pass by luck alone. The winner\'s SR&#770; is inflated &#8212; selected from a distribution of N attempts, not drawn from a single clean test. A plain t-stat on SR&#770; misses this entirely.</div>'+
          '<p class="note">DSR corrects by computing SR* (expected best SR from N zero-alpha trials) and testing whether SR&#770; beats it. Output is PSR &#8212; a probability that fits naturally into a PM conversation: "PSR 0.97, 43 trials."</p>'+
          '<p class="note"><b>Alternatives considered:</b> Bonferroni (divide significance threshold by N &#8212; simple but too conservative, ignores non-normality) &#183; BHY / Benjamini-Hochberg (controls false discovery rate, better for large N) &#183; Bootstrap permutation (no distributional assumptions, expensive). DSR is preferred: cheap, accounts for skew and kurt, produces an interpretable probability, and is standard language at pod shops.</p>'},
       {h:"Gate 2 &#8212; Factor Decomposition: why",
        html:'<div class="callout"><b>Residual alpha is the only thing a PM pays for.</b> Every known risk premium &#8212; market, momentum, carry, value, VRP &#8212; can be bought cheaper via ETFs or futures. If your signal\'s return is explained by a known factor, you are adding factor exposure with extra steps, not alpha.</div>'+
          '<table class="ptable" style="margin-top:10px"><tr><th>Factor</th><th>What</th><th>Why check it</th></tr>'+
          '<tr><td>Market (MKT)</td><td>Beta to broad market direction</td><td>Cheapest, freest exposure &#8212; signal must add above passive beta</td></tr>'+
          '<tr><td>Momentum (MOM)</td><td>12&#8722;1 month cross-sectional return</td><td>Documented premium &#8212; does your signal do more than ride price trend?</td></tr>'+
          '<tr><td>Carry</td><td>Rate / roll / dividend yield differential</td><td>Paid to bear duration or basis risk &#8212; if carry explains it, name it honestly</td></tr>'+
          '<tr><td>Value</td><td>Mean reversion to a fundamental anchor</td><td>Long-run convergence premium &#8212; slow but real</td></tr>'+
          '<tr><td>VRP</td><td>Short implied, long realised vol spread</td><td>Option-seller premium &#8212; if your signal is VRP, own it</td></tr>'+
          '<tr><td>Universe-specific</td><td>DXY for FX &#183; real yield for rates &#183; CDS for credit &#183; etc.</td><td>Include any factor a sceptical PM would ask "is this just X?"</td></tr>'+
          '</table>'+
          '<p class="note"><b>OLS is the default.</b> For fat-tailed return distributions, run Huber regression alongside &#8212; outlier events distort OLS betas. Build the factor set from the universe defined at Step 2, not pre-specified globally.</p>'},
       {h:"Gate 3 &#8212; Regime Diagnostic: why",
        html:'<div class="callout"><b>If your IS sample was mostly one regime, your IC estimate is regime-specific, not general.</b> IC = 0.05 averaged over the full sample may be IC = 0.09 in trending markets and IC = &#8722;0.01 in choppy markets. The average flatters. The split reveals.</div>'+
          '<p class="note"><b>Define regimes from past data only &#8212; no lookahead:</b><br>&#183; Rolling Hurst exponent: H &gt; 0.5 = trending, H &lt; 0.5 = mean-reverting<br>&#183; Rolling vol percentile: high-vol / low-vol<br>&#183; HMM (Hidden Markov Model): probabilistic, forward-compatible, preferred for Bayesian updating at each step t</p>'+
          '<p class="note"><b>Three outcomes:</b> IC stable across regimes &#8594; clean, proceed to Step 5. IC high in one regime only &#8594; regime-dependent (revise hypothesis at Step 1, add regime filter). IC negative in a regime &#8594; signal reverses &#8212; investigate before OOS.</p>'+
          '<p class="note">This is a <em>diagnostic</em>, not a design step. You are not building a regime engine here &#8212; you are checking whether the IS claim survives across conditions. If it doesn\'t, the fix starts at Step 1.</p>'}],
     kill:"PSR &lt; 0.95 (trial count inflated the result) &#183; t(&#945;) &lt; 2 after factor stripping (signal is a known premium in disguise) &#183; IC collapses in one regime (sample-specific edge). Any failure &#8594; back to Step 1."},

          '<g fill="#1c1c1a" text-anchor="middle">'+
          '<text x="117" y="497" font-size="9.5">PASS → Step 6</text>'+
          '<text x="330" y="490" font-size="8.5">QUALIFIED PASS (power flag)</text>'+
          '<text x="330" y="501" font-size="8.5">→ Step 6 · Lean load-bearing</text>'+
          '<text x="543" y="497" font-size="9.5">REJECT → archive → Step 1</text>'+
          '</g>'+
          '</svg>'+
          '<p class="note">One question, four gates, three outcomes. The seal breaks once at the top; everything below reads the same held-out result. The two-line outcome — PASS vs <b>QUALIFIED PASS</b> — exists because a short OOS is low-power: a clean t-stat on too little data is not a clean verdict.</p>'},
       {h:"The metrics — what, why, mental model",
        html:'<table class="ptable"><tr><th>Symbol</th><th>Full name</th><th>What it measures / why</th><th>Mental model</th></tr>'+
          '<tr><td>IC_OOS</td><td>Out-of-sample Information Coefficient</td><td>Rank correlation of forecast vs forward return, on data the signal never touched — the only number not fittable in hindsight</td><td>The grade on the unseen exam</td></tr>'+
          '<tr><td>ICIR</td><td>IC Information Ratio</td><td>mean(IC) / std(IC) — drives the <em>cross-sectional</em> t-stat. Stability of skill, not just its average</td><td>Steady skill beats lucky spikes</td></tr>'+
          '<tr><td>t</td><td>t-statistic</td><td>ICIR·√T (cross-sectional) or IC·√N_eff (time-series) — is the OOS IC distinguishable from luck? Gate: t &gt; 1.65</td><td>Standard errors from zero</td></tr>'+
          '<tr><td>N_eff</td><td>Effective sample size</td><td>T / (1 + 2·Σρₖ) — independent observations left after overlap correction. Overlapping forward returns are not independent</td><td>Your real count of coin-flips</td></tr>'+
          '<tr><td>min-IC</td><td>Minimum detectable IC</td><td>1.65/√N_eff — the smallest IC this OOS could even detect. If it exceeds your signal IC, a pass is luck</td><td>The honesty check on a pass / fail</td></tr>'+
          '<tr><td>ratio</td><td>Degradation ratio</td><td>metric_OOS / metric_IS — fraction of the IS edge surviving on unseen data. Some decay is normal</td><td>How much was real vs fitted</td></tr>'+
          '<tr><td>decay(h)</td><td>IC by horizon</td><td>IC at each forward lag h, IS vs OOS — does the timing structure generalize, or was the hold period sample-specific?</td><td>The signal\'s fingerprint</td></tr>'+
          '<tr><td>PSR</td><td>Probabilistic Sharpe Ratio</td><td>P(true SR &gt; 0) on the OOS curve, N=1, skew/kurt-adjusted — catches a Sharpe propped up by a few fat tails</td><td>Confidence the curve is not lucky tails</td></tr>'+
          '<tr><td>Lock</td><td>Horizon Lock</td><td>The IS/OOS split date, fixed at Step 2 before any IS work — stops you choosing a split that flatters OOS</td><td>Pre-registration, like a clinical trial</td></tr>'+
          '<tr><td>archetype</td><td>Signal archetype</td><td>Cross-sectional (panel) vs time-series (one instrument), declared at Step 1 — picks which t-stat formula is valid</td><td>Which machine you are scoring with</td></tr>'+
          '</table>'+
          '<p class="note"><b>Why a power floor, not just a t-stat:</b> the OOS gate is inherently low-power on short histories. A bare pass / fail hides that. Reporting min-detectable IC turns "it failed" into the honest "we could not tell" — which is a QUALIFIED PASS, not a kill.</p>'},
       {h:"The archetype switch — one gate, two t-stats",
        html:'<div class="callout"><b>IC is not one metric.</b> A panel of names and a single instrument are scored by different machines — and the t-stat formula must follow the machine, or the power audit lies by an order of magnitude.</div>'+
          '<table class="ptable" style="margin-top:10px"><tr><th>&nbsp;</th><th>Cross-sectional</th><th>Time-series</th></tr>'+
          '<tr><td>Universe</td><td>panel of many names</td><td>one instrument</td></tr>'+
          '<tr><td>IC computed</td><td>across names each period, then averaged</td><td>once, down the time axis</td></tr>'+
          '<tr><td>t-stat</td><td>ICIR × √T   (T = periods)</td><td>IC × √N_eff   (overlap-corrected)</td></tr>'+
          '<tr><td>Degradation</td><td>ICIR_OOS / ICIR_IS</td><td>IC_OOS / IC_IS</td></tr>'+
          '<tr><td>Power floor</td><td>usually breadth-bound (names × rebalances)</td><td>usually history-bound (N_eff)</td></tr>'+
          '<tr><td>Your venue</td><td>IBKR equities · Darwinex futures basket</td><td>Just Markets XAUUSD</td></tr></table>'+
          '<p class="note"><b>The trap this fixes:</b> describing cross-sectional IC ("computed period by period") but then using the time-series formula t = IC·√T. They are different machines. For a cross-sectional signal with ICIR ≈ 0.5 you need ~11 periods to clear the gate, not "4–12 years" — that scary number is an artefact of the wrong denominator. The archetype, set at Step 1, picks the formula.</p>'},
       {h:"Gate 1 — OOS IC t-stat + the power audit",
        html:'<div class="callout"><b>OOS is the only test the signal could not have been tuned to.</b> Step 4 corrected the IS estimate for trial inflation, factor exposure and regime bias — but all of that lives <em>inside</em> the IS period. None of it protects against unconscious fitting to data you have already seen. Held-out data does.</div>'+
          '<p class="note"><b>The power problem:</b> the t-stat gate is low-power on short OOS. Always report the minimum detectable IC = 1.65/√N_eff next to the result. If the smallest IC you could detect exceeds your signal\'s IC, a "pass" is luck and a "fail" is inconclusive — that routes to a QUALIFIED PASS, where Step 6 (Lean) carries the weight, not a clean kill.</p>'+
          '<p class="note"><b>The overlap trap:</b> overlapping forward returns (e.g. a 12-day return sampled daily) are autocorrelated, so naive √T overstates significance. Use N_eff = T/(1+2·Σρₖ) — the same Newey-West correction Step 3 already computes. Ignoring it can inflate the t-stat 2–3×.</p>'+
          '<p class="note"><b>Spearman, not Pearson:</b> one crash can dominate a Pearson IC; ranks treat every period equally. Mandatory for fat-tailed assets.</p>'},
       {h:"Gate 2 — IS→OOS degradation",
        html:'<div class="callout"><b>Degradation always happens — and that is healthy.</b> IS contains real edge + noise; the noise does not repeat OOS, so IC_OOS &lt; IC_IS is normal. A ratio near 1.0, or above, is <em>suspicious</em>, not reassuring — usually OOS is too short to dilute the noise, or its regime happened to flatter the signal.</div>'+
          '<p class="note"><b>The threshold is per-signal-class, set at Step 1 — not universal.</b> High-frequency mean reversion degrades fast (accept ratio &gt; ~0.3); slow value signals degrade little (hold ratio &gt; ~0.6). Forcing one number pretends all signals share a noise structure.</p>'+
          '<p class="note"><b>You cannot game it:</b> choosing a short IS (noisy IC_IS) or long IS (washed-out IC_IS) would move the ratio — but the Horizon Lock fixes the split before you ever see IC_IS.</p>'},
       {h:"Gate 3 — decay profile match",
        html:'<div class="callout"><b>A signal that is real but mistimed shows IC in both IS and OOS, yet peaks at a different lag.</b> The decay curve is the signal\'s fingerprint: where IC peaks sets the holding period, how fast it fades sets the exit.</div>'+
          '<p class="note"><b>Method:</b> compute IC at lags 1…N for IS and OOS, overlay them, score shape similarity (rank correlation of the two decay vectors). Flag if the peak lag shifts more than 2× or shape correlation &lt; 0.6.</p>'+
          '<p class="note"><b>Outcomes:</b> shape matches → holding period generalizes. Peak shifts → revise the hold (back to Step 1). Curve flattens OOS → predictive horizon is shorter than estimated; may survive at a tighter exit. Negative OOS IC at the expected lag → timing is wrong, or look-ahead leaked.</p>'},
       {h:"Gate 4 — PSR on the OOS curve",
        html:'<div class="callout"><b>The IC t-stat assumes roughly normal returns; the OOS equity curve rarely is.</b> A few large drawdowns make it fat-tailed. PSR (Probabilistic Sharpe Ratio) prices in skew and kurtosis, catching the case where the OOS Sharpe looks fine but rode a couple of lucky tails.</div>'+
          '<p class="note"><b>Why the threshold drops to 0.90</b> (vs 0.95 in Step 4): in OOS you ran one pre-specified test, not a search. Trial count N = 1, so the luck ceiling SR* ≈ 0 and the hurdle is genuinely lower — but only if you really tested once. See the OOS budget.</p>'},
       {h:"The one-shot rule & the OOS budget",
        html:'<div class="callout"><b>The one-shot rule is per signal — but Step 4 lets a rejected hypothesis revise and loop back (max 3×).</b> If each loop re-tests on the same held-out slice, that is multiple OOS looks, and "N = 1" is a lie by loop 3. The seal erodes every time you peek.</div>'+
          '<p class="note"><b>The fix — an OOS budget:</b> after L trips back through this gate, tighten the t-stat to the Šidák / Bonferroni critical value for L tests. Cheapest discipline: a revised hypothesis must re-clear Step 3 + Step 4 on IS <em>alone</em>, and only the final survivor touches OOS once.</p>'+
          '<p class="note"><b>The cleanest OOS is forward time</b> — live paper trading at Step 8. A backtest OOS is a proxy for it, never a replacement. That is why a QUALIFIED PASS can still proceed: live-forward will deliver the verdict the short backtest could not.</p>'}],
     kill:"Three outcomes, not two. <b>PASS</b> — all four gates clear → Step 6. <b>QUALIFIED PASS</b> — IC t-stat clears but the OOS is underpowered (min detectable IC &gt; signal IC) → Step 6 with a power flag, Lean Engine becomes load-bearing. <b>REJECT</b> — any gate fails → archive the result (IS IC, OOS IC, degradation, regime) and return to Step 1. A rejected signal is not banned; a genuinely new hypothesis can restart. Forbidden: tuning the rejected signal and re-running the seal."},

    {num:"6",name:"LEAN Execution Gate",role:"Does the alpha survive contact with reality?",
     q:"Does the edge survive real costs — spread, swap, slippage, impact, fills?",
     in:"A Step-5 survivor + its frictionless SR_gross + the target venue",
     out:"A net-of-cost tradeable signal — pass · revise · kill",
     inside:[
       "<em>LEAN is the engine</em> — event-driven (prevents lookahead by construction) with built-in cost / slippage / fill models. We configure them; we never rebuild a cost simulator",
       "Custom venue model: Just Markets CFD gold has <em>no</em> LEAN brokerage model — write a FeeModel with spread + the overnight swap",
       "The swap is mandatory for CFD — a multi-day XAUUSD hold is dominated by financing, not spread",
       "No-trade buffer: only rebalance when |target − current| &gt; band — the main lever to cut turnover without killing the signal",
       "Capacity at the <em>target</em> AUM via the √(size/ADV) impact law or a size sweep — not the toy backtest size",
       "Gate evaluator reads LEAN's net output and applies the kill — it judges, it does not backtest",
       "Backtest-live parity: the same QCAlgorithm runs in test and live, or the backtest is a lie"],
     math:[
       "net return = gross return − ( spread + commission + swap + slippage + impact )",
       "market impact ∝ √( order size / ADV )        [Almgren square-root law]",
       "cost_ratio = (SR_gross − SR_net) / SR_gross        capacity = AUM at which net alpha → 0",
       "t(SR_net) = SR_net (per-period) × √T        [per-period units rule — never the annualised SR]",
       "break-even cost = the per-trade cost at which SR_net = 0"],

          '<g font-size="10.5" fill="#1c1c1a" text-anchor="middle">'+
          '<text x="300" y="30">Step-5 survivor + SR_gross + venue</text>'+
          '<text x="300" y="158">Net equity curve (after all real costs)</text>'+
          '<text x="300" y="205" font-weight="600">CAPACITY — net alpha alive at target AUM?</text>'+
          '<text x="300" y="220" font-size="9" fill="#6b6b66">√(size/ADV) impact law or size sweep · not backtest size</text>'+

          '</svg>'+
          '<p class="note">LEAN does the rigour (the dark box); the three checks below it are <em>our</em> evaluator judging LEAN\'s net output. Precedence: capacity → cost-significance → turnover. A <b>revise</b> means the edge is real but turnover is bleeding it — widen the buffer or lengthen the hold, back to Step 1/3.</p>'},
       {h:"Division of labour — LEAN vs us",
        html:'<div class="callout"><b>LEAN is the engine. We do not write a cost simulator.</b> LEAN is event-driven (lookahead impossible by construction) and already ships brokerage / fee / slippage / fill models. We configure those and add only the three things LEAN cannot give us.</div>'+
          '<table class="ptable" style="margin-top:10px"><tr><th>Piece</th><th>Who</th><th>Why</th></tr>'+
          '<tr><td>Event-driven backtest + built-in cost / fill models</td><td><b>LEAN</b></td><td>The rigour — don\'t rebuild it</td></tr>'+
          '<tr><td>Custom Just Markets CFD FeeModel (spread + swap)</td><td>us</td><td>LEAN has no Just Markets model; the swap kills multi-day CFD holds and no default includes it</td></tr>'+
          '<tr><td>The QCAlgorithm that emits the signal</td><td>us</td><td>Our signal logic, run inside LEAN</td></tr>'+
          '<tr><td>Gate evaluator — net-Sharpe kill</td><td>us</td><td>LEAN judges nothing; same role the Step 4/5 scoreboards play</td></tr>'+
          '<tr><td>Capacity sweep — run at N sizes</td><td>us</td><td>One LEAN run is one AUM; capacity needs a sweep</td></tr></table>'},
       {h:"The metrics — what, why, mental model",
        html:'<table class="ptable"><tr><th>Symbol</th><th>Full name</th><th>What it measures / why</th><th>Mental model</th></tr>'+
          '<tr><td>SR_gross</td><td>Gross Sharpe ratio</td><td>Frictionless Sharpe carried from Step 5 — the edge before costs</td><td>The exam score with no penalties</td></tr>'+
          '<tr><td>SR_net</td><td>Net Sharpe ratio</td><td>Sharpe of the LEAN equity curve after every real cost</td><td>The score after penalties deducted</td></tr>'+
          '<tr><td>cost_ratio</td><td>Cost erosion ratio</td><td>(SR_gross − SR_net)/SR_gross — fraction of the edge execution eats</td><td>How much of the edge the market takes</td></tr>'+
          '<tr><td>turnover</td><td>Annualised turnover</td><td>Traded notional / AUM per year — the multiplier on per-trade cost</td><td>How often you pay the toll</td></tr>'+
          '<tr><td>break_even</td><td>Break-even cost</td><td>The per-trade cost at which SR_net = 0 — your margin of safety</td><td>How much room before the edge dies</td></tr>'+
          '<tr><td>capacity</td><td>Strategy capacity</td><td>AUM at which net alpha → 0 under the impact law</td><td>The biggest bet the edge can carry</td></tr>'+
          '<tr><td>swap</td><td>Overnight financing</td><td>Daily carry on a held CFD position — venue-specific, often dominant</td><td>Rent to hold leverage overnight</td></tr>'+
          '<tr><td>impact</td><td>Market impact</td><td>Price move from your own order; ∝ √(size/ADV)</td><td>Your footprint moving price against you</td></tr>'+
          '<tr><td>t(SR_net)</td><td>t-stat on net Sharpe</td><td>SR_net (per-period) × √T — is the net edge distinguishable from zero?</td><td>Standard errors of net edge from zero</td></tr>'+
          '</table>'+
          '<p class="note"><b>Currency shifts from correlation to PnL here.</b> IC was right for Steps 3–5; costs are PnL, not correlation, so Step 6 judges net Sharpe, cost ratio, turnover and capacity instead.</p>'},
       {h:"Cost model branches by venue",
        html:'<div class="callout">The cost model branches by venue — exactly as the Step 5 t-stat branched by archetype. The same signal has a different survival bar on each.</div>'+
          '<table class="ptable" style="margin-top:10px"><tr><th>Venue</th><th>Dominant costs</th><th>Market impact?</th><th>Capacity bound by</th></tr>'+
          '<tr><td>Just Markets <span style="font-weight:400">(real $)</span></td><td>spread + <b>swap</b></td><td>none (trade vs broker)</td><td>broker max position / leverage</td></tr>'+
          '<tr><td>Darwinex Zero</td><td>spread + commission + roll</td><td>yes (real exchange)</td><td>market depth</td></tr>'+
          '<tr><td>IBKR <span style="font-weight:400">(paper)</span></td><td>commission + spread + short borrow</td><td>yes</td><td>market depth</td></tr></table>'+
          '<p class="note"><b>The swap trap:</b> for a multi-day XAUUSD CFD hold the overnight financing typically dwarfs the spread — yet it is the cost most often left out of a backtest. Omitting it manufactures fake net alpha. Costs are also state-dependent: spread/slippage widen at news and rollover, so prefer the Step-2 cost telemetry over a fixed constant.</p>'},
       {h:"Turnover, buffering & capacity",
        html:'<p class="note"><b>Turnover is death by a thousand cuts.</b> A signal with great IC but daily rebalancing can net negative after costs, while the same signal at a weekly hold survives. Turnover × per-trade cost is the bleed.</p>'+
          '<p class="note"><b>The no-trade buffer is the fix.</b> Only rebalance when |target − current| exceeds a band (hysteresis). It slashes churn for a tiny tracking-error cost — the main lever a <em>revise</em> verdict tells you to widen.</p>'+
          '<p class="note"><b>Capacity is measured at the target AUM, not the backtest size.</b> A signal that nets +alpha at $100k can be meaningless at $50M once the √(size/ADV) impact kicks in. On Just Markets capacity is broker-capped (no central book, impact ≈ 0); on Darwinex / IBKR it is genuine market depth. Recall a Step-5 <b>QUALIFIED PASS</b> routes underpowered signals here as the final arbiter — for those, this gate carries the full burden of proof.</p>'}],
     kill:"Three outcomes. <b>pass</b> — net edge significant and capacity ≥ target → Step 7. <b>revise</b> — edge exists but cost-dominated by turnover → widen the no-trade buffer / lengthen the hold, back to Step 1/3. <b>kill-cost</b> — net Sharpe not significantly &gt; 0 after real costs. <b>kill-capacity</b> — capacity below the target AUM for the chosen venue."},

    {num:"7",name:"Research Note",role:"Synthesize the evidence chain into a go / no-go",

       {h:"The evidence chain — what each step contributes",
        html:'<table class="ptable"><tr><th>From</th><th>Evidence it contributes</th><th>Pulled from</th></tr>'+
          '<tr><td>Step 3</td><td>IC · ICIR · IC t-stat · decay half-life</td><td>RAPID_FIRE_SCOREBOARD.md</td></tr>'+

       {h:"Folder system — one flat note per signal",
        html:'<p class="note">Step 7 has no compute, so it has no function sub-folders. To keep the workspace clean, each signal gets <b>one self-contained markdown file</b> — no nested per-run folders like Steps 3–6.</p>'+
          '<div class="math">step7-research-note/\n├── RESEARCH_NOTE_INDEX.md      # dashboard: every RN, signal, venue, decision, date\n├── NOTE_TEMPLATE.md            # canonical structure — copy per signal\n└── notes/\n    ├── RN-001-IB-001-b2b.md     # one file, self-contained, links upstream\n    └── RN-XXX-....md</div>'+
          '<p class="note"><b>Naming:</b> RN-&lt;seq&gt;-&lt;idea&gt;-&lt;tag&gt;. The RN id threads the whole chain: IB-001 → RF-001 → IV-001 → OG-001 → LE-001 → <b>RN-001</b>. One glance at the index tells you every signal\'s verdict and where it sits.</p>'},
       {h:"Pod-shop language — the translation that gets you hired",
        html:'<div class="callout">This note is the artifact a Balyasny / Millennium PM reads. Translate every retail phrase into the residual-alpha vocabulary they buy.</div>'+
          '<table class="ptable" style="margin-top:10px"><tr><th>Don\'t write</th><th>Write</th></tr>'+
          '<tr><td>"Sharpe 1.16"</td><td>"IC 0.05, ICIR 1.2, alpha decays over 12 trading days"</td></tr>'+
          '<tr><td>"I built a backtest"</td><td>"I measured the IC and decay profile of this signal"</td></tr>'+
          '<tr><td>"the strategy works"</td><td>"60 bps/yr residual α survives a Fama-French 5-factor decomposition"</td></tr>'+
          '<tr><td>"OOS degradation 27.5%"</td><td>"IC stable IS→OOS, t-stat 2.3, PSR 96%"</td></tr></table>'+
          '<p class="note"><b>The decision must be concrete:</b> not "looks promising" but "GO — deploy at $X on &lt;venue&gt;, ¼-Kelly, kill-switch at −Y% drawdown." The note ends in an action, not an impression.</p>'}],
     kill:"Evidence too weak, not factor-orthogonal, or capacity too small → <b>NO-GO</b>. The note is still written and filed — a no-go is a graveyard entry, not wasted work. A GO must state size + venue + risk limits explicitly, or it is not a decision."},

    {num:"8",name:"Risk + Deploy",role:"Size, constrain, go live — then attribute",
     q:"How much, what stops me blowing up, and did it behave as predicted?",
     in:"A GO decision + the research note (size + venue + risk limits stated)",
     out:"Live positions under hard limits + live attribution that recycles to Step 1",
     inside:[
       "Volatility targeting — size to a constant risk budget, not to conviction or excitement",
       "<em>Risk runs twice</em> — size each signal to its vol target, then a portfolio-level cap scales the whole book down after combination (correlated signals stack risk)",
       "Fractional Kelly (¼–½), never full — full Kelly assumes you know the true edge and has brutal drawdowns",
       "Kill switch / hard drawdown limit defined <em>before</em> going live — pre-commitment beats in-the-moment rationalising",
       "Staged ramp: paper → small live → scale; never backtest-to-full-size",
       "Live attribution closes the loop: realised IC vs expected, slippage vs model, alpha-decay drift → feeds the Ledger &amp; Step 1 ↻"],
     math:[
       "vol_scalar = daily_cash_vol_target / instrument_value_vol",
       "position = vol_scalar × (forecast / 10)        [forecast standardized, |avg| ~ 10]",
       "fractional Kelly: f = fraction × (expected_return / variance)        fraction ∈ [¼, ½]",
       "portfolio_scalar = min(1, target_vol / √(wᵀ Σ w))        [the second risk pass]",

          '<p class="note"><b>Risk runs twice</b> is the non-obvious bit: a signal sized to 10% vol on its own can blow the portfolio budget once it stacks with correlated signals, so a second pass scales the whole book down by target_vol / √(wᵀΣw). Live attribution is what makes this a <em>cycle</em>, not a line — realised-vs-expected drift loops back to Step 1.</p>'},
       {h:"The metrics — what, why, mental model",
        html:'<table class="ptable"><tr><th>Symbol</th><th>Full name</th><th>What it measures / why</th><th>Mental model</th></tr>'+
          '<tr><td>vol_scalar</td><td>Volatility scalar</td><td>cash_vol_target / instrument_value_vol — converts a risk budget into a position size</td><td>The dial that sizes to risk, not to excitement</td></tr>'+
          '<tr><td>forecast</td><td>Standardized forecast</td><td>The signal output, centred 0, |avg| ~ 10 — conviction in comparable units across assets</td><td>How loud the signal is shouting</td></tr>'+
          '<tr><td>f</td><td>Fractional Kelly</td><td>fraction × (expected_return/variance) — the aggression dial; ¼–½, never full</td><td>How hard you press a known edge</td></tr>'+
          '<tr><td>port_vol</td><td>Portfolio volatility</td><td>√(wᵀΣw) — combined risk after correlations; drives the second risk pass</td><td>The book\'s true risk once signals stack</td></tr>'+
          '<tr><td>max_dd</td><td>Max drawdown limit</td><td>Pre-committed hard floor that trips the kill switch</td><td>The line you draw before emotions arrive</td></tr>'+
          '<tr><td>IC_live</td><td>Realised live IC</td><td>Spearman of forecast vs realised return, live — the truth vs the backtest promise</td><td>Did the edge show up with real money</td></tr>'+
          '<tr><td>drift</td><td>Alpha decay / drift</td><td>(IC_live − IC_expected) × √N_eff — is live materially below expectation?</td><td>The edge wearing off in real time</td></tr>'+
          '<tr><td>slip_real</td><td>Realised slippage</td><td>Live fill vs decision price vs the Step-6 model — validates the cost assumptions</td><td>Whether reality matched the cost model</td></tr>'+
          '</table>'+
          '<p class="note"><b>Vol targeting and Kelly are complementary:</b> vol targeting sets the <em>scale</em> (risk budget), fractional Kelly sets the <em>aggression</em> (how hard you press). Neither alone is sizing.</p>'},
       {h:"Risk runs twice — why one pass is not enough",
        html:'<div class="callout">Sizing a signal to a 10% vol target is necessary but not sufficient. Two signals each at 10% vol that are 0.8-correlated combine to far more than 10% portfolio vol. Risk must run again at the book level.</div>'+
          '<p class="note"><b>Pass 1 (per-signal):</b> vol_scalar × (forecast/10), fractional Kelly, clipped to a per-position cap. Sizes the individual bet to its own risk budget.</p>'+
          '<p class="note"><b>Pass 2 (portfolio):</b> compute port_vol = √(wᵀΣw) from the strategy covariance, then scale the whole book by min(1, target_vol/port_vol). This catches the correlation stacking a single-signal view is blind to.</p>'+
          '<p class="note">Same idea the multi-strats use: PMs size their own books, then the central risk desk caps aggregate exposure after combination.</p>'},
       {h:"Attribution — the loop closer, in pod-shop language",
        html:'<div class="callout">The pipeline is a cycle, not a line. Live attribution is the feedback edge: it measures whether the edge you measured actually showed up, and feeds the diagnosis back to Step 1.</div>'+
          '<table class="ptable" style="margin-top:10px"><tr><th>Measure</th><th>Question</th><th>If it fails</th></tr>'+
          '<tr><td>IC_live vs IC_expected</td><td>Did the predictive edge survive live?</td><td>Drift → revisit hypothesis at Step 1</td></tr>'+
          '<tr><td>slippage realised vs model</td><td>Was the Step-6 cost model honest?</td><td>Re-tune the cost model; re-run Step 6</td></tr>'+
          '<tr><td>realised vol vs target</td><td>Did vol targeting hold?</td><td>Recalibrate the vol estimator (Market State Engine · E4)</td></tr>'+
          '<tr><td>drawdown vs kill limit</td><td>Are we inside the risk budget?</td><td>Breach → trip the kill switch, flatten</td></tr></table>'+
          '<p class="note"><b>Venue framing:</b> Just Markets (real money) → kill-switch discipline is paramount. Darwinex Zero → the audited track record for allocators. IBKR paper → attribution written in residual-α / realised-IC language is the artifact BAM / Millennium read.</p>'}],
     kill:"Breaches a position, exposure or drawdown limit → trip the kill switch and flatten. Live drift (realised IC materially below expected) → loop back to Step 1 to revise the hypothesis. ↻ This is where the pipeline becomes a cycle."}
  ];

  const found=[
    {id:"F1",name:"Data Machinery",role:"PIT store · cleaners · adjusters · OOS vault",
     q:"How do we get honest data, cheaply, every time?",
     in:"Raw vendor / broker feeds",
     out:"Clean, point-in-time, served data on demand",
     inside:[
       "<b>Home: folded into Step 2</b> (step2-dataset/) — NOT a standalone engine. Step 2 is sole owner + producer; everyone downstream consumes its served manifest, never the cleaners.",
       "Built <em>once per asset class</em>, then reused by every idea",
       "Point-in-time store — no lookahead, no restated data",
       "Cleaning + adjustment capabilities (rolls, corporate actions)",
       "IS/OOS splitter and the sealed OOS vault",
       "A serving interface the backtester calls"],
     math:["First principle: every datum has TWO timestamps — event-time (when it happened) and knowledge-time (when you could first know it). An honest backtest filters on knowledge-time ≤ t, never event-time. Every F1 component fights one adversary: time leakage.",
       "Capability vs instance: build the futures-handling once; loading GC 2015–2025 is then trivial",
       "Status: contract written (step2-dataset/DATA_MACHINERY.md); thin slice built by the CS-GOLD-JM-H1 audit"],
     kill:"Infrastructure — not part of the per-idea cull. It enables the steps above."},

    {id:"F2",name:"Market State Engine",role:"source → regime → levels → size → trigger (5 engines · measurement layer)",
     q:"What forces are acting on price now, and how big is the move likely to be?",
     in:"Clean prices + reference instruments (futures / ETF / options / FX / rates)",
     out:"Raw continuous READINGS — GEX · σ · OI · CVD · betas (not conditions, not alpha)",
     inside:[
       "<b>Home: alpha-engine/market-state-engine/ — top-level engine, MEASUREMENT layer.</b> Rescoped 2026-05-22 from 'F2 Volatility' + promoted out of research-engine/foundation/ (serves research AND execution). Read by Steps 3/4/8 + Context Engine. <b>Scaffold built (5 contract stubs); only E4 has code.</b>",
       "<b>Bedrock law:</b> price moves when someone is mechanically <em>forced</em> to trade; dealer option hedging is the largest forced flow; it is observable via positioning; it cascades across linked assets. Retail watches price (effect); this watches forced flow (cause).",
       "<b>E1 Cross-Asset</b> — <em>where force originates.</em> Reference graph (XAUUSD ← GC ← GLD ← DXY ← real yields). The unlock: a CFD price is a shadow; read flow from the objects casting it.",
       "<b>E2 Dealer Gamma (GEX +vanna/charm)</b> — <em>dampen or amplify?</em> Long gamma → suppress/mean-revert; short gamma → chase/trend. The bridge from options positioning to tape behaviour.",
       "<b>E3 Positioning (OI/COT/max-pain)</b> — <em>levels & fuel.</em> Where positions ARE (vs E2 = how sensitive they are).",
       "<b>E4 Volatility (realised/EWMA/GK/YZ)</b> — <em>the ruler.</em> The only engine built; sizing & signal-normalization. Vol-<em>trading</em> (VRP) is a strategy in Step 1/3, not here.",
       "<b>E5 Order Flow / Microstructure (+liquidity/VPIN)</b> — <em>is it happening now?</em> Volume profile, CVD, book imbalance — the trigger / confirmation.",
       "<b>Two layers:</b> this engine MEASURES (objective numbers); F4 CLASSIFIES them into conditions. Compute once here, classify separately above.",
       "<b>CFD insight:</b> XAUUSD CFD has no real volume — it inherits flow by reading its casting objects (GC/GLD options) via E1. Multi-asset-agnostic design is therefore required, not optional."],
     math:["raw_forecast = signal / σ   →   E4 makes edge comparable across gold, bonds, equities",
       "GEX sign (E2) = the reflexivity switch: long-gamma regime is mean-reverting, short-gamma is trending — mechanical, before it happens",
       "Tier-1 caveat: no single fund bundles all 5 (siloed across desks). The connected force→regime→level→size→trigger state object is the solo-researcher edge."],
     kill:"Infrastructure — feeds Signal + Risk. Build rule: a reading earns code only when a Step-1 hypothesis NAMES it (same falsification discipline as F4). E1-gold slice likely next."},

    {id:"F3",name:"Research Ledger",role:"Every hypothesis · trial count · graveyard",
     q:"How many things have we actually tried?",
     in:"Outcomes from every step, every idea, all time",
     out:"The global trial count + a searchable graveyard",
     inside:[
       "<b>Home: research-engine/research-ledger/ — research-level (above the steps).</b> Written by EVERY step (incl. the Step-3 massacre), read at Step 4 — upstream of Step 7, so it cannot live in any single step. Research-only — execution never reads it, so it stays inside the funnel, not a top-level engine. <b>Built ✓ (thin)</b>",
       "<b>Two counters:</b> <em>ideas_considered</em> (every idea at any step → graveyard) vs <em>trials_measured</em> (only configs scored on data, Step 3+ → feeds Step-4 DSR). A Step-1 'no story' kill is an idea, not a trial.",
       "Append-only (ledger.jsonl) — never edit a past line; immutability is what makes the count trustworthy",
       "Also tracks OOS-touch budget per series (decision #8)",
       "Distinct from Step 7's graveyard: Step 7 keeps narrative obituaries of ideas that <em>reached</em> Step 7; F3 keeps the full body-count. Step 7 reads F3, doesn't own it."],
     math:["Test 1,000 ideas → ~50 look significant at p<0.05 by luck. trials_measured is your defense.",
       "Right counter matters: ideas_considered would over-deflate (punishes untested ideas); trials_measured is the honest N for DSR"],
     kill:"Infrastructure — the discipline that keeps the whole funnel honest."},

    {id:"F4",name:"Context Engine",role:"Classifies market-state readings into conditions — state, not forecasts",
     q:"What state do the market's readings put us in right now?",
     in:"Market State Engine readings (GEX · σ · OI · betas) + PIT macro",
     out:"Discrete CONDITIONS consumed by signals, combination & risk",
     inside:[
       "<b>Home: alpha-engine/context-engine/ — top-level engine, CLASSIFICATION layer, DOCUMENTED STUB.</b> Earns code only when a Step-1 hypothesis actually gates on regime (else it is infra no measurement asked for).",
       "<b>Two-layer split:</b> the Market State Engine MEASURES (raw readings); this CLASSIFIES them into conditions ('short-gamma regime', 'high-vol regime'). Measurement objective; classification opinionated.",
       "Emits <em>conditions</em>, not alpha — a condition modulates a signal (gate it on/off, or scale it)",
       "Conditions: regime (HMM), <b>gamma regime (from E2)</b>, volatility regime (from E4), macro state, session/liquidity (from E5), trend-vs-range, correlation regime (from E1), event-proximity",
       "Signals gate/scale on it · Combination re-weights families by it · Risk sizes down on it",
       "Note: volatility wears three hats — estimator (market-state E4), conditioner (vol regime, here), and signal (VRP, Step 1/3)"],
     math:[
       "Prefer a continuous scaler (weight 0→1) over a hard on/off gate — avoids the regime-cliff risk",
       "A condition earns its place only if conditional IC > unconditional IC, out-of-sample"],
     kill:"Overfitting magnet — <em>default is UNCONDITIONED</em>. Add a condition back only when measurement (Step 4) forces it, and log every trial in the Ledger."}
  ];

  const flowEl=document.getElementById("flow");
  const foundEl=document.getElementById("found");
  const panel=document.getElementById("panel");
  let active=null;

  steps.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="node"; b.dataset.k="s"+i;
    b.innerHTML='<span class="num">'+s.num+'</span><span><span class="nm">'+s.name+'</span><span class="rl">'+s.role+'</span></span>';
    b.onclick=()=>select("s"+i);
    flowEl.appendChild(b);
    if(i<steps.length-1){const c=document.createElement("div");c.className="conn";flowEl.appendChild(c);}
  });
  found.forEach((f,i)=>{
    const b=document.createElement("button");
    b.className="fnode"; b.dataset.k="f"+i;
    b.innerHTML='<span class="nm">'+f.name+'</span><span class="rl">'+f.role+'</span>';
    b.onclick=()=>select("f"+i);
    foundEl.appendChild(b);
  });

  function data(k){return k[0]==="s"?steps[+k.slice(1)]:found[+k.slice(1)];}

  function render(d,isFound){
    const insideLis=d.inside.map(x=>"<li>"+x+"</li>").join("");
    const mathRows=d.math.map(m=>'<div class="math">'+m+'</div>').join("");
    panel.innerHTML=
      '<div class="ptag">'+(isFound?"FOUNDATION":"STEP "+d.num)+'</div>'+
      '<div class="ptitle">'+d.name+'</div>'+
      '<p class="pq">'+d.q+'</p>'+
      '<div class="io">'+
        '<div class="box"><div class="lbl">Input</div><div class="val">'+d.in+'</div></div>'+
        '<div class="box"><div class="lbl">Output</div><div class="val">'+d.out+'</div></div>'+
      '</div>'+
      '<div class="sec"><h3>What\'s inside</h3><ul>'+insideLis+'</ul></div>'+
      '<div class="sec"><h3>Metrics &amp; math</h3>'+mathRows+'</div>'+
      (d.extra||[]).map(e=>'<div class="sec"><h3>'+e.h+'</h3>'+e.html+'</div>').join("")+
      '<div class="sec"><h3>'+(isFound?"Role":"Kill gate")+'</h3><div class="kill">'+d.kill+'</div></div>';
  }

  function select(k){
    active=k;
    document.querySelectorAll(".node,.fnode").forEach(n=>n.classList.toggle("active",n.dataset.k===k));
    render(data(k),k[0]==="f");
  }

  select("s0");
})();
</script>
</body>
</html>
