; GRW-001 — SCALP smoke, TIGHT stop (task 294). grw_meta v0.2.0.
;
; WHY THIS EXISTS: the 10-pip sibling (grw_scalp_m1_smoke.ini) ruined the account in
; TWO DAYS — 91 trades, $20 -> $0.00 — and the reason is structural, not bad luck.
;
;   At the 0.01 min lot the risk per trade is PINNED to the stop distance in USD.
;   A 10-pip stop risks $1.00 whatever InpRiskFrac says. At $20 that is 5%; at $10
;   equity it is 10%; at $2 it is 50%. The account CANNOT delever — it is already at
;   the broker minimum — so the risk fraction mechanically ESCALATES as equity falls.
;   That is an auto-martingale, the exact inverse of position sizing, and it is why
;   the measured run showed mean_risk 14.6% and max_risk 123% against a declared 5%.
;
; The only lever available inside the $20 mandate is a SMALLER STOP, because at min lot
; the stop IS the size. 5 pips = $0.50 = 2.5% of $20 -> ~40 consecutive losses to ruin
; instead of ~20, and the clamp only begins once equity drops below $20.
;
; THE TRADE-OFF, stated so it is not rediscovered: 5 pips against Just Markets' ~2-pip
; spread means cost = 0.4R per round trip. This run is on XAUUSD_dukas (ECN, sub-pip),
; so it CANNOT settle that. It measures SURVIVABILITY AND FREQUENCY only. The cost
; verdict needs JM's own ticks plus the measured spread curve from task 298.
;
; REAL TICKS (Model=4). Run: terminal64.exe /config:<abs path>  (JM terminal CLOSED.)
