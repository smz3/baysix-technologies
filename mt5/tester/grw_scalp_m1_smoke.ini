; GRW-001 — SCALP SUBSTRATE smoke (task 294). grw_meta v0.2.0.
;
; WHAT THIS RUN ANSWERS — one question, deliberately:
;   Does the substrate actually SCALP at $20 without clamping?
;   i.e. (a) does it produce hundreds of trades per day, and (b) is InpRiskFrac
;   honoured — clamp_up_frac ~ 0, sizing_valid=1 — instead of the 100% clamp and
;   sizing_valid=0 that the H1 grw_smoke_20usd run produced?
;
; WHAT IT DOES *NOT* ANSWER: whether the thing is profitable. XAUUSD_dukas carries
; DUKASCOPY's spread (ECN, sub-pip), not Just Markets' ~2 pips. On a 10-pip stop that
; is the difference between cost = 0.02R and cost = 0.20R, so the P&L on this run is
; NOT a cost verdict and must never be read as one. The cost-honest re-run needs JM's
; own tick history plus the MEASURED spread curve from task 298.
;
; THE ARITHMETIC THIS CONFIG IS BUILT ON (brokers/justmarkets.yaml):
;   min lot 0.01 = 1 oz -> $1 of gold = $1 of P&L, so stop distance in USD IS risk in USD.
;   InpSlPips=10 -> a $1.00 stop.  $20 x InpRiskFrac 0.05 = $1.00.
;   => the sizing call asks for EXACTLY 0.01 lot. This is the one stop distance at which
;      a $20 account can express a 5% risk fraction without being forced to over-risk.
;      That is the whole point of GRW_SL_ABS_PIPS and the reason H1 could not do this.
;
; REAL TICKS (Model=4) — entries are close-driven but exits manage tick-by-tick.
; Run: terminal64.exe /config:<abs path>   (JM terminal must be CLOSED first.)
[Tester]
Expert=grw_system\grw_meta.ex5
Symbol=XAUUSD_dukas
Period=M1
Model=4
FromDate=2017.01.01
ToDate=2017.04.01
Deposit=20
Currency=USD
; 1:3000 is the VENUE's tier for equity < $999 (brokers/justmarkets.yaml:86). The inherited
; 1:100 was not a conservative choice, it was a wrong one: at 1:100 a 0.01-lot gold position
; needs ~$11.50 of margin, so the first smoke ran 16 trades, dropped to $11.10 equity, and
; then had every remaining signal REFUSED for margin — 9803 skips that looked like a
; strategy result and were an account-spec error. At 1:3000 the same position needs ~$0.38.
Leverage=1:3000
Optimization=0
ShutdownTerminal=1
Report=grw_scalp_m1_smoke_report
ReplaceReport=1
[TesterInputs]
; --- AXIS 1: entry
InpEntryType=0
InpLookback=20
InpExtK=2.0
InpSlBufK=0.5
InpRetestBars=5
; --- stop distance = the sizing instrument (v0.2.0)
InpSlMode=1
InpSlPips=10.0
InpSlMaxPips=20.0
; --- AXIS 2: filters. 0 = take everything. Baseline on purpose: this run is measuring
; the substrate's raw firing rate, and a gate would confound "does it scalp" with
; "does the gate help". Gates get their own pre-registered configs.
InpFilterMask=0
InpCostMult=4.0
; --- AXIS 3: exit. RR 1.5 on a 10-pip stop = a 15-pip target, which resolves in minutes
; on M1 gold — that is what makes hundreds of trades a day mechanically possible.
InpExitType=0
InpRR=1.5
InpArmR=1.0
InpTrailAtr=1.5
InpTimeStopBars=20
; --- AXIS 4: sizing
InpRiskFrac=0.05
InpUndersize=1
; --- plumbing
InpSignalTf=1
InpHtf=16385
InpAtrPeriod=14
InpMaxOpen=1
InpMagic=4001
InpBatchId=scalp_m1_smoke
