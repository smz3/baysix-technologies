# Infrastructure
qdrant:
  url: "http://localhost:6333"
  collection: "research"
  vector_size: 384  # all-MiniLM-L6-v2 dimension

ollama:
  url: "http://localhost:11434"
  models:
    primary: "qwen2.5:7b"     # Sentiment, summarization
    verify: "mistral:7b"       # Cross-check verification

embeddings:
  model: "all-MiniLM-L6-v2"
  dimension: 384
  device: "cpu"  # CPU is fast enough (~10ms/embed)
