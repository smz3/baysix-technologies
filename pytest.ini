[pytest]
# Collection rails (task 374, stage 2 reorg).
#
# _archive/ is the parked namespace (rule 5). Archived code keeps its OLD imports
# (`research.code.*`) on purpose — that IS the disconnect. Collecting it would both
# resurrect dead modules and let a parked system fail a live run.
#
# platforms/ibkr/Scripts/ are hand-run connection probes against a live IB gateway,
# named *_test.py but never unit tests. They errored at collection long before this
# reorg; excluding them makes repo-wide `pytest` usable as a verification step.
norecursedirs = _archive .venv .git __pycache__ node_modules platforms/ibkr/Scripts

testpaths = research/tests
