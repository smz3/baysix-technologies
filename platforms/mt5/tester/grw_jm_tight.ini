; GRW-001 — TRUE JM COST, tight stop (5 pips). grw_meta v0.2.0.
;
; WHY THIS EXISTS: the three prior runs all used Symbol=XAUUSD_dukas — Dukascopy ECN
; ticks, sub-pip spread. The tester DID charge cost on those runs; it charged the WRONG
; VENUE'S cost. The MT5 tester takes its spread from the bid/ask in the symbol's own tick
; data, so pointing it at a different broker's feed silently swaps the cost model.
;
; Just Markets' own XAUUSD.s real-tick history is on disk (bases/*/ticks/XAUUSD.s,
; 2021.03 -> 2026.07). Running on it means the tester charges JM's real spread, tick by
; tick, with no probe, no assumption, and no TCM constant. This ini supersedes the cost
; caveat on grw_scalp_m1_tight.ini.
;
; Sample window starts 2021.04 because that is where JM's tick history begins. That is a
; shorter and different-regime sample than the dukas runs — matched pair vs grw_jm_wide.ini,
; NOT comparable to the 2016/2017 dukas numbers.
;
; REAL TICKS (Model=4). Run: terminal64.exe /config:<abs path>  (JM terminal CLOSED.)
[Tester]
Expert=grw_system\grw_meta.ex5
Symbol=XAUUSD.s
Period=M1
Model=4
FromDate=2021.04.01
ToDate=2026.07.01
Deposit=20
Currency=USD
Leverage=1:3000
Optimization=0
ShutdownTerminal=1
Report=grw_jm_tight_report
ReplaceReport=1
[TesterInputs]
InpEntryType=0
InpLookback=20
InpExtK=2.0
InpSlBufK=0.5
InpRetestBars=5
InpSlMode=1
InpSlPips=5.0
InpSlMaxPips=20.0
InpFilterMask=0
InpCostMult=4.0
InpExitType=0
InpRR=1.5
InpArmR=1.0
InpTrailAtr=1.5
InpTimeStopBars=20
InpRiskFrac=0.025
InpUndersize=1
InpSignalTf=1
InpHtf=16385
InpAtrPeriod=14
InpMaxOpen=1
InpMagic=4001
InpBatchId=jm_tight
