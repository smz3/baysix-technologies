; GRW-001 — TRUE JM COST, wide stop (10 pips). grw_meta v0.2.0.
;
; Matched sibling of grw_jm_tight.ini — same symbol, window, deposit and leverage; the ONLY
; differences are InpSlPips (10.0 vs 5.0) and InpRiskFrac (0.05 vs 0.025), which at the 0.01
; min lot are the same lever: the stop distance IS the position size.
;
; The pair exists to settle the vise on JM's real spread rather than on Dukascopy's:
;   tight -> cost is a LARGER fraction of a smaller stop (worse breakeven win rate)
;   wide  -> risk% at min lot escalates faster as equity falls (task 300 auto-martingale)
; Read them together or not at all.
;
; REAL TICKS (Model=4). Run: terminal64.exe /config:<abs path>  (JM terminal CLOSED.)
[Tester]
Expert=grw_system\grw_meta.ex5
Symbol=XAUUSD.s
Period=M1
Model=4
FromDate=2021.04.01
ToDate=2026.07.01
Deposit=20
Currency=USD
Leverage=1:3000
Optimization=0
ShutdownTerminal=1
Report=grw_jm_wide_report
ReplaceReport=1
[TesterInputs]
InpEntryType=0
InpLookback=20
InpExtK=2.0
InpSlBufK=0.5
InpRetestBars=5
InpSlMode=1
InpSlPips=10.0
InpSlMaxPips=20.0
InpFilterMask=0
InpCostMult=4.0
InpExitType=0
InpRR=1.5
InpArmR=1.0
InpTrailAtr=1.5
InpTimeStopBars=20
InpRiskFrac=0.05
InpUndersize=1
InpSignalTf=1
InpHtf=16385
InpAtrPeriod=14
InpMaxOpen=1
InpMagic=4001
InpBatchId=jm_wide
