; GRW-001 — the SAME config as grw_smoke_2yr.ini on the REAL target deposit ($20,
; task 293). Also not a result: no prereg, so nothing here becomes a step4_results row.
;
; This one is a measurement of the ACCOUNT, not the strategy. XAUUSD min lot is 0.01
; = 1 oz = $1 per $1 of gold, so a stop of a few dollars already risks more than 1% of
; $20 and the requested risk fraction cannot be expressed. What comes back — the clamp
; rate, the realised risk-per-trade, and how many orders the margin refuses — is the
; input to task 286 (position sizing vs the actual live account) and decides whether
; $20 is a viable deposit for a compounding batch at all.
;
; REAL TICKS (Model=4). Run: terminal64.exe /config:<abs path>  (JM terminal CLOSED).
[Tester]
Expert=grw_system\grw_meta.ex5
Symbol=XAUUSD_dukas
Period=H1
Model=4
FromDate=2016.06.01
ToDate=2018.06.01
Deposit=20
Currency=USD
Leverage=1:100
Optimization=0
ShutdownTerminal=1
Report=grw_smoke_20usd_report
ReplaceReport=1
[TesterInputs]
InpEntryType=0
InpLookback=20
InpExtK=2.0
InpSlBufK=0.5
InpRetestBars=5
InpFilterMask=0
InpExitType=0
InpRR=2.0
InpRiskFrac=0.01
InpUndersize=1
InpAtrPeriod=14
InpMaxOpen=1
InpMagic=4001
InpBatchId=smoke20
