; GRW-001 — TASK 318 SMOKE. First-ever execution of grw_meta v0.3.0.
;
; NOT a result. No pre-registration, so nothing here becomes a step4_results row and
; nothing here may be pooled into a grw_passes p_hat. The only question this run answers
; is whether the barrier MACHINERY works end to end:
;   (1) OnInit prints "EPISODE armed" with target 40.00 / floor 2.00 off a $20 deposit
;   (2) equity touching a barrier flips ep_state ONCE, flattens the book, and opens
;       nothing further for the rest of the window
;   (3) OnTester returns 1.0 (target-first) / 0.0 (floor-first) / -1e9 (CENSORED)
;   (4) the 9 episode columns land in grw_run_<tag>.csv and ingest_grw.py still parses it
; A CENSORED pass is a valid outcome, not a failure (grw_fitness.json v2.0.0).
;
; SYMBOL: XAUUSD.s — the LIVE JustMarkets symbol, not the XAUUSD_dukas custom symbol the
; earlier smoke inis used. Real ticks for XAUUSD.s are already on disk in the JM terminal
; (MEASURED: bases/JustMarkets-Demo2/ticks/XAUUSD.s, 202103..202607), so Model=4 needs no
; download. This is deliberate: the mandate account trades XAUUSD.s, and the min-lot
; arithmetic that decides everything at $20 is the BROKER's, not dukascopy's.
;
; LEVERAGE 1:3000 — JM's equity-tiered ladder gives 1:3000 below $999 equity
; (research/brokers/justmarkets.yaml:112). The older grw_smoke_*.ini files used 1:100,
; which would have the tester refuse orders the real account would accept.
;
; WINDOW 6 months. Short by design: a barrier episode is expected to resolve in ~21 trades.
;
; REAL TICKS (Model=4). Run: terminal64.exe /config:<abs path>  (JM terminal CLOSED).
[Tester]
Expert=grw_system\grw_meta.ex5
Symbol=XAUUSD.s
Period=H1
Model=4
FromDate=2021.04.01
ToDate=2021.10.01
Deposit=20
Currency=USD
Leverage=1:3000
Optimization=0
ShutdownTerminal=1
Report=grw_smoke318_report
